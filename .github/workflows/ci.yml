name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm test -- --run
      - run: cd web && npm run build
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/verify-web-embed.sh

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: >-
          TUNNELMESH_AGENT_TOKEN=ci-placeholder
          TUNNELMESH_CLIENT_TOKEN=ci-placeholder
          docker compose -f docker-compose.local.yml config
      - run: >-
          TUNNELMESH_AGENT_TOKEN=ci-placeholder
          TUNNELMESH_CLIENT_TOKEN=ci-placeholder
          docker compose -f docker-compose.local.yml --profile agent --profile client config
      # The cluster file must keep interpolating with only the three variables
      # the documented bootstrap exports: a `:?` on the opt-in mysql56 profile
      # would break the cluster flow for everyone, and only `config` proves the
      # profile is really excluded from the default run.
      - run: >-
          MYSQL_PASSWORD=ci-placeholder
          MYSQL_ROOT_PASSWORD=ci-placeholder
          TUNNELMESH_STORAGE_MYSQL_DSN='tunnelmesh:ci-placeholder@tcp(mysql:3306)/tunnelmesh?parseTime=true&tls=true'
          docker compose -f docker-compose.cluster.yml config | tee "${RUNNER_TEMP}/cluster.yml"
      - run: "! grep -Eq '^  mysql56:' \"${RUNNER_TEMP}/cluster.yml\""
      - run: >-
          MYSQL_PASSWORD=ci-placeholder
          MYSQL_ROOT_PASSWORD=ci-placeholder
          TUNNELMESH_STORAGE_MYSQL_DSN='tunnelmesh:ci-placeholder@tcp(mysql:3306)/tunnelmesh?parseTime=true&tls=true'
          docker compose -f docker-compose.cluster.yml --profile mysql56 config
          | grep -Eq '^  mysql56:'

  # The Windows tray shell is guarded by a build tag and compiled by no other job: the default
  # build never enables the tag, and the release workflow only packages it on a tag. Without
  # this job the whole native shell could stop compiling and the pull request would be green.
  windows-tray:
    runs-on: ubuntu-latest
    env:
      # The tray is pure Go over WebView2, so cgo has to stay off: enabling it here would
      # silently turn a cross-compilation check into a host-compiler check.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-tray/package-lock.json
      # `-tags tray` activates internal/tray/webdist/embed.go, whose pattern matches nothing
      # in a fresh checkout: without the bundle every Go step below fails on the embed instead
      # of on the code it exists to check. The admin bundle is deliberately not built here -
      # the package list below is why this job must not reach internal/server.
      - run: cd web-tray && npm ci
      - run: cd web-tray && npm run build
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Check formatting of the tray packages
        # The tray code is excluded from the default build, so a formatting error in it would
        # otherwise be noticed by nothing.
        run: test -z "$(gofmt -l internal/tray internal/client cmd/tunnelmesh-client-tray scripts/trayicon | tee /dev/stderr)"
      - name: Build and vet the tray shell for both windows architectures
        # The package list is exactly the directories carrying a `tray` build constraint.
        # `./...` is not usable: it also reaches internal/server, whose `//go:embed
        # all:web_dist` needs the admin bundle. The client lock is vetted separately because
        # go reads test files, and that is the only way its windows-only test gets compiled
        # without a Windows host.
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" go build -tags tray ./cmd/tunnelmesh-client-tray ./internal/tray/...
            GOOS=windows GOARCH="$arch" go vet -tags tray ./cmd/tunnelmesh-client-tray ./internal/tray/...
            GOOS=windows GOARCH="$arch" go vet -tags tray ./internal/client
          done
      - name: Run the tray guard and logic tests
        # These packages hold the assertions that keep the build tag honest and the windows
        # bundle (icons, winres, installer, panel route) in sync with the Go side.
        run: go test ./scripts ./internal/tray ./internal/client ./deploy/windows ./deploy/macos -count=1
      - name: Compile the NSIS installer against a stub executable
        # A syntax error or a missing include in installer.nsi would otherwise fail the release
        # job minutes before anything is published. The stub is not a tunnel client; it only
        # has to be a file for the installer's File command to embed.
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          printf 'MZ' > "${stage}/TunnelMeshClient.exe"
          makensis -DVERSION=0.0.0-ci -DARCH=amd64 -DBUILD_DIR="${stage}" \
            -DICON_FILE="${GITHUB_WORKSPACE}/deploy/windows/TunnelMeshClient.ico" \
            -DOUTFILE="${stage}/setup.exe" "${GITHUB_WORKSPACE}/deploy/windows/installer.nsi"
          test -s "${stage}/setup.exe"
  mysql56:
    # MySQL 5.6 is the lowest server version the project supports; a production
    # fleet still runs 5.6.51. The MySQL-backed contract tests are gated behind
    # TUNNELMESH_TEST_MYSQL_DSN and were never run in CI, which is how a 32-bit
    # connection_epoch column and JSON "null" capabilities reached a real server
    # unnoticed. This job runs the same contract assertions against the floor
    # version so driver-specific SQL cannot ship unverified.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.6
        env:
          MYSQL_DATABASE: tunnelmesh_test
          MYSQL_USER: tunnelmesh
          MYSQL_PASSWORD: tunnelmesh
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # No multiStatements: applySchemaStatements splits every DDL and migration
      # script into single statements, in the tests and on the auto-init path
      # alike. The flag was required until e8b7c0d moved the whole-script
      # ExecContext calls onto that splitter, and TestMySQLGatedTestsNeverExecWholeDDLScripts
      # keeps it from coming back as a hidden dependency of this DSN again.
      TUNNELMESH_TEST_MYSQL_DSN: tunnelmesh:tunnelmesh@tcp(127.0.0.1:3306)/tunnelmesh_test?parseTime=true&tls=false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run MySQL 5.6 repository and registry contracts
        # -p 1 is required, not a tuning knob: both packages open the same
        # schema_meta in one database and auto-init inserts its single row, so
        # running the packages in parallel loses a race on INSERT id=1.
        run: go test -p 1 ./internal/storage ./internal/registry -count=1 -run MySQL

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tunnelmesh
      MYSQL_USER: tunnelmesh
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - tunnelmesh-mysql-data:/var/lib/mysql
    restart: unless-stopped

  # Disposable MySQL 5.6 instance for the project's supported floor version,
  # opt-in through the `mysql56` profile so it never starts with the cluster
  # stack. CI runs the same version and the same contract tests; this service
  # exists so a contributor can reproduce a red mysql56 check locally, and
  # unlike the CI service container it also uses production's utf8mb4 charset
  # (deploy/mysql56/utf8mb4.cnf). Steps: docs/development/testing.md.
  # No TLS and no real data: keep the host binding on loopback.
  mysql56:
    image: mysql:5.6
    profiles: ["mysql56"]
    environment:
      MYSQL_DATABASE: tunnelmesh_test
      MYSQL_USER: tunnelmesh
      MYSQL_PASSWORD: ${MYSQL56_TEST_PASSWORD:-tunnelmesh}
      MYSQL_ROOT_PASSWORD: ${MYSQL56_ROOT_PASSWORD:-tunnelmesh-root}
    ports:
      # 3307 so a local MySQL 8 on the default port and the cluster `mysql`
      # service above both keep working.
      - "127.0.0.1:3307:3306"
    volumes:
      - tunnelmesh-mysql56-test-data:/var/lib/mysql
      - ./deploy/mysql56/utf8mb4.cnf:/etc/mysql/conf.d/tunnelmesh.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL56_ROOT_PASSWORD:-tunnelmesh-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  server-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: server
    image: tunnelmesh:server-cluster
    command: ["run"]
    environment: &server-environment
      TUNNELMESH_MODE: cluster
      TUNNELMESH_STORAGE_DRIVER: mysql
      TUNNELMESH_STORAGE_AUTO_INIT: ${TUNNELMESH_STORAGE_AUTO_INIT:-true}
      TUNNELMESH_STORAGE_MYSQL_DSN: ${TUNNELMESH_STORAGE_MYSQL_DSN:?set a TLS MySQL DSN}
      TUNNELMESH_STORAGE_MYSQL_TLS: "true"
      TUNNELMESH_STORAGE_MYSQL_CA: /run/secrets/mysql-ca.pem
      # 可恢复密文的主密钥（service-token secret、OIDC client secret）。缺失时
      # 相关写入接口 fail-closed 返回 503 secret_storage_unavailable，不会静默
      # 降级成只存哈希。只能由外部环境注入，禁止写入本文件、镜像或配置仓库。
      # 轮换前必须保证所有节点读到同一个 KEY_ID，否则旧密文无法解密。
      TUNNELMESH_TOKEN_ENCRYPTION_KEY: ${TUNNELMESH_TOKEN_ENCRYPTION_KEY:-}
      TUNNELMESH_TOKEN_ENCRYPTION_KEY_ID: ${TUNNELMESH_TOKEN_ENCRYPTION_KEY_ID:-}
      # traceroute hop 签名链校验密钥，集群内所有 Server/relay 节点必须一致。
      TUNNELMESH_TRACE_SIGNING_KEY: ${TUNNELMESH_TRACE_SIGNING_KEY:-}
      TUNNELMESH_NODE_ID: server-1
      TUNNELMESH_REGISTRY_TYPE: ${TUNNELMESH_REGISTRY_TYPE:-database}
      TUNNELMESH_REGISTRY_ENDPOINTS: ${TUNNELMESH_REGISTRY_ENDPOINTS:-}
      # 跨节点 relay。不开启时两个 Server 各自独立，Agent 连到没有目标路由的
      # 节点就无法访问另一节点上的 Agent。
      # 首次启动需先建 server_node token，见 docs/deployment/docker.md 的引导顺序。
      TUNNELMESH_SERVER_RELAY_ENABLED: ${TUNNELMESH_SERVER_RELAY_ENABLED:-true}
      # 只在 Compose 网络内可达，不要发布到宿主机。
      TUNNELMESH_SERVER_RELAY_LISTEN: 0.0.0.0:9443
      # 其它节点访问本节点的地址，必须用 Compose 服务名，不能写 127.0.0.1。
      TUNNELMESH_SERVER_RELAY_ENDPOINT: server-1:9443
      # server_node 类型 service token（fleet token 或显式节点允许列表）。
      # 留空且 relay 开启时 check-config 直接失败，不会静默降级。
      TUNNELMESH_SERVER_RELAY_NODE_TOKEN: ${TUNNELMESH_SERVER_RELAY_NODE_TOKEN:-}
      # mTLS 材料由 scripts/gen-relay-certs.sh 生成。CA 只挂证书不挂私钥，
      # 每个节点只能读到自己的证书和私钥。
      # 改为明文 relay（仅限受控内网）：把下面四个变量导出为空字符串。
      TUNNELMESH_SERVER_RELAY_CA: ${TUNNELMESH_SERVER_RELAY_CA:-/run/secrets/relay/relay-ca.pem}
      TUNNELMESH_SERVER_RELAY_CERT: ${TUNNELMESH_SERVER_RELAY_CERT:-/run/secrets/relay/node/relay.pem}
      TUNNELMESH_SERVER_RELAY_KEY: ${TUNNELMESH_SERVER_RELAY_KEY:-/run/secrets/relay/node/relay-key.pem}
      # 所有节点必须一致，且写入每张节点证书的 SAN。
      TUNNELMESH_SERVER_RELAY_SERVER_NAME: ${TUNNELMESH_SERVER_RELAY_SERVER_NAME:-relay.tunnelmesh.internal}
    ports:
      # Server 只有一个监听器（server.http_addr，容器内默认 :80）。公网 HTTPS/WSS
      # 由反向代理终止；要让 Server 自己终止 TLS，需设置 TUNNELMESH_TLS_ENABLED=true、
      # 挂载证书并配置 TUNNELMESH_TLS_CERT_FILE / TUNNELMESH_TLS_KEY_FILE，再映射 443。
      - "80:80"
    volumes:
      - ./deploy/certs/mysql-ca.pem:/run/secrets/mysql-ca.pem:ro
      - ./deploy/certs/relay/relay-ca.pem:/run/secrets/relay/relay-ca.pem:ro
      - ./deploy/certs/relay/server-1:/run/secrets/relay/node:ro
    depends_on:
      - mysql
    restart: unless-stopped

  server-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: server
    image: tunnelmesh:server-cluster
    command: ["run"]
    environment:
      <<: *server-environment
      TUNNELMESH_NODE_ID: server-2
      TUNNELMESH_SERVER_RELAY_ENDPOINT: server-2:9443
    ports:
      - "8080:80"
    volumes:
      - ./deploy/certs/mysql-ca.pem:/run/secrets/mysql-ca.pem:ro
      - ./deploy/certs/relay/relay-ca.pem:/run/secrets/relay/relay-ca.pem:ro
      - ./deploy/certs/relay/server-2:/run/secrets/relay/node:ro
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  tunnelmesh-mysql-data:
  tunnelmesh-mysql56-test-data:

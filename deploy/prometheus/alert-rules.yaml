groups:
  - name: tunnelmesh-alerts
    rules:
      - alert: TunnelMeshServerNotReady
        expr: absent(tunnelmesh_ready{component="server"}) or min(tunnelmesh_ready{component="server"}) < 1
        for: 2m
        labels: {severity: critical}
        annotations: {summary: TunnelMesh server is not ready}
      - alert: TunnelMeshAgentOffline
        expr: absent(tunnelmesh_connections_active{component="agent"}) or sum(tunnelmesh_connections_active{component="agent"}) == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: No active TunnelMesh agent connection}
      - alert: TunnelMeshHeartbeatMisses
        expr: absent(tunnelmesh_heartbeat_total) or sum(rate(tunnelmesh_heartbeat_total{result=~"miss|timeout"}[5m])) > 0
        for: 3m
        labels: {severity: warning}
        annotations: {summary: TunnelMesh heartbeat misses detected}
      - alert: TunnelMeshRelayFailures
        expr: absent(tunnelmesh_relay_total) or sum(rate(tunnelmesh_relay_total{result=~"failed|error"}[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: TunnelMesh relay failures detected}
      - alert: TunnelMeshStorageFailures
        expr: absent(tunnelmesh_storage_errors_total) or sum(rate(tunnelmesh_storage_errors_total[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: TunnelMesh storage failures detected}
      - alert: TunnelMeshProbeDegraded
        expr: absent(tunnelmesh_probe_total) or tunnelmesh:probe:success_ratio5m < 0.95
        for: 10m
        labels: {severity: warning}
        annotations: {summary: TunnelMesh probe success ratio is degraded}
      - alert: TunnelMeshMetricsMissing
        expr: absent(tunnelmesh_ready)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: TunnelMesh metrics scrape is absent}
      # 下面两条刻意不加 `absent(...) or` 前缀：server.proxy_entry.enabled 默认 false，
      # 未启用时 tunnelmesh_proxy_entry_* 根本不存在，加 absent() 会让所有没开这个功能的
      # 部署持续告警。阈值取“10 分钟平均每秒 0.2 次认证失败 / 0.5 次拒绝”，低于该量级的
      # 零星公网扫描不值得叫人。
      - alert: TunnelMeshProxyEntryAuthFailures
        expr: sum(rate(tunnelmesh_proxy_entry_auth_failures_total[10m])) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: TunnelMesh tp proxy entry sees sustained Basic auth failures}
      - alert: TunnelMeshProxyEntryDenials
        expr: sum(rate(tunnelmesh_proxy_entry_requests_total{result!="success"}[10m])) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: TunnelMesh tp proxy entry is denying proxy requests}
      # 租约回收是「被杀掉的 Client」留下的死行离开该表的唯一路径：正常释放需要对端配合，
      # 掉电、被 SIGKILL、断网都走不到。清扫循环遇到数据库错误只记录不退出，所以回收停摆
      # 不会让 Server 崩掉，只能靠指标发现——两条规则各管一种停法：持续失败、彻底停摆。
      # 删除语句以时间戳为边界且幂等，任一节点跑成功一轮就够，因此这里跨节点求和：它表达的
      # 是「没有任何节点在回收」，正是需要叫醒人的那一件事；单节点部署里等价于逐节点检测。
      # 阈值口径与 docs/operations/observability.md 一致：间隔 1 分钟，15 分钟内多于 3 轮失败
      # 才算异常；10 分钟内一轮都没有即停摆（同期正常应有约 10 轮）。
      - alert: TunnelMeshLeaseSweepErrors
        expr: sum(increase(tunnelmesh_client_connection_lease_sweep_total{result="error"}[15m])) > 3
        for: 15m
        labels: {severity: warning}
        annotations: {summary: TunnelMesh client connection lease reaping keeps failing}
      - alert: TunnelMeshLeaseSweepStalled
        expr: absent(tunnelmesh_client_connection_lease_sweep_total) or sum(increase(tunnelmesh_client_connection_lease_sweep_total[10m])) == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: TunnelMesh client connection lease reaping is not running}

openapi: 3.0.3
info:
  title: TunnelMesh Server API
  version: 1.0.0
  description: Versioned management API for agents, policies, routes, tunnels and audit logs.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      summary: Login and issue an opaque bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /api/v1/auth/me:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current principal } }
  /api/v1/auth/password:
    put:
      summary: Change the current user's password without revoking existing login tokens
      security: [{ bearerAuth: [] }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}}
      responses: {'200': {description: Password changed}, '400': {description: Password policy violation}, '401': {description: Unauthenticated}, '403': {description: Current password is invalid}}
  /api/v1/users:
    get:
      summary: List ordinary child accounts
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: status, in: query, schema: {type: string, enum: [active, deleted, all], default: active}}
      responses: {'200': {description: Cursor page}, '401': {description: Unauthenticated}, '403': {description: Administrator required}}
    post:
      summary: Create an ordinary child account and return its temporary password once
      security: [{ bearerAuth: [] }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserCreateRequest'}}}}
      responses: {'201': {description: Created; response uses Cache-Control no-store}, '400': {description: Invalid username}, '401': {description: Unauthenticated}, '403': {description: Administrator required}, '409': {description: Username conflict}}
  /api/v1/users/{userId}:
    parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
    patch:
      summary: Enable or disable an ordinary account
      security: [{ bearerAuth: [] }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserStatusRequest'}}}}
      responses: {'200': {description: Updated}, '400': {description: Invalid request}, '403': {description: Administrator account is protected}, '404': {description: Not found}, '409': {description: Account is deleted}}
    delete:
      summary: Logically delete an ordinary account while retaining all related resources
      security: [{ bearerAuth: [] }]
      responses: {'200': {description: Logically deleted}, '403': {description: Administrator account is protected}, '404': {description: Not found}}
  /api/v1/users/{userId}/reset-password:
    parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
    post:
      summary: Reset an ordinary account password and return the temporary password once
      security: [{ bearerAuth: [] }]
      responses: {'200': {description: Reset; response uses Cache-Control no-store}, '403': {description: Administrator account is protected}, '404': {description: Not found}, '409': {description: Account is deleted}}
  /api/v1/users/{userId}/restore:
    parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
    post:
      summary: Restore a logically deleted ordinary account
      security: [{ bearerAuth: [] }]
      responses: {'200': {description: Restored}, '403': {description: Administrator account is protected}, '404': {description: Not found}}
  /api/v1/dashboard/summary:
    get:
      summary: Read resource counts and recent events within the current principal's scope
      security: [{ bearerAuth: [] }]
      responses: {'200': {description: Dashboard summary}, '401': {description: Unauthenticated}}
  /api/v1/agents:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Cursor page}}
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}}
      responses: {'201': {description: Created}, '403': {description: Forbidden}, '409': {description: Conflict}}
  /api/v1/agents/{agentId}:
    parameters: [{name: agentId, in: path, required: true, schema: {type: string}}]
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Agent}, '404': {description: Not found}}}
    put: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}}, responses: {'200': {description: Updated}}}
    patch: {security: [{bearerAuth: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}}, responses: {'200': {description: Updated}}}
    delete: {security: [{bearerAuth: []}], responses: {'200': {description: Deleted}}}
  /api/v1/agents/{agentId}/metadata:
    parameters:
      - {name: agentId, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/IncludeStale'}
    get:
      summary: Read the latest runtime metadata reported by an agent
      description: Stale snapshots are omitted by default. Set includeStale=true to read the last stale snapshot marked with stale=true. Runtime metadata is read-only through this API.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Runtime metadata snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMetadataEnvelope'
        '401': {description: Unauthenticated}
        '403': {description: Agent is not owned by the caller}
        '404': {description: Agent or metadata snapshot not found, or snapshot is stale without includeStale=true}
  /api/v1/agents/{agentId}/connections:
    parameters: [{name: agentId, in: path, required: true, schema: {type: string}}]
    get:
      summary: List live physical Agent connections across Server nodes
      description: Returns durable registry leases for one Agent and overlays fresher process-local state for connections owned by the responding Server. Only the Agent owner or an administrator may read this list.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Cluster connection list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentConnectionClusterEnvelope'}
        '401': {description: Unauthenticated}
        '403': {description: Agent is not owned by the caller}
        '404': {description: Agent not found}
        '503': {description: Cluster connection registry is unavailable}
  /api/v1/agents/{agentId}/connections/{connectionId}:
    parameters:
      - {name: agentId, in: path, required: true, schema: {type: string}}
      - {name: connectionId, in: path, required: true, schema: {type: string}}
      - {name: connectionEpoch, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}, description: Registry lease epoch returned by the connection list}
    delete:
      summary: Close one exact physical Agent connection
      description: Local connections are closed through the exact-fenced local controller. Remote connections are closed through authenticated Server-node mTLS relay control. If the exact lease has already disappeared, the request succeeds idempotently. If the owning Server is unreachable, the lease remains intact and the API returns 503.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Connection closed or already absent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentConnectionCloseEnvelope'}
        '400': {description: connectionEpoch is missing or invalid}
        '401': {description: Unauthenticated}
        '403': {description: Agent is not owned by the caller}
        '404': {description: Agent not found}
        '409': {description: Connection epoch is stale; a replacement connection was not closed}
        '500': {description: Connection close failed}
        '503': {description: Owning Server node or cluster registry is unavailable; the lease is preserved}
  /api/v1/agents/{agentId}/trace:
    parameters: [{name: agentId, in: path, required: true, schema: {type: string}}]
    post:
      summary: Run a logical client-to-agent traceroute
      description: Follows authenticated client, server, relay and agent hops. Sensitive fields are administrator-only and secrets are never returned by this endpoint.
      security: [{bearerAuth: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TraceRequest'}}}}
      responses: {'200': {description: Trace result, content: {application/json: {schema: {$ref: '#/components/schemas/TraceEnvelope'}}}}, '403': {description: Forbidden sensitive request}}
  /api/v1/agents/{agentId}/diagnose:
    parameters: [{name: agentId, in: path, required: true, schema: {type: string}}]
    post:
      summary: Run an authorized TCP, HTTP, or UDP network probe
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiagnoseRequest'}}}}
      responses: {'200': {description: Bounded probe result}, '403': {description: Agent is not owned by caller}}
  /api/v1/agents/{agentId}/probes:
    parameters: [{name: agentId, in: path, required: true, schema: {type: string}}]
    get:
      summary: List bounded probe history
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Cursor page of probe summaries}}
  /api/v1/agents/{agentId}/policies:
    parameters: [{name: agentId, in: path, required: true, schema: {type: string}}]
    get: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Policies}}}
    post: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRequest'}}}}, responses: {'201': {description: Created}}}
  /api/v1/agents/{agentId}/policies/{policyId}:
    parameters: [{name: agentId, in: path, required: true, schema: {type: string}}, {name: policyId, in: path, required: true, schema: {type: string}}]
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Policy}}}
    put: {security: [{bearerAuth: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRequest'}}}}, responses: {'200': {description: Updated}}}
    patch: {security: [{bearerAuth: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRequest'}}}}, responses: {'200': {description: Updated}}}
    delete: {security: [{bearerAuth: []}], responses: {'200': {description: Deleted}}}
  /api/v1/routes:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Managed routes}}}
    post: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TunnelRequest'}}}}, responses: {'201': {description: Created}, '409': {description: Duplicate route}}}
  /api/v1/routes/{routeId}:
    parameters: [{name: routeId, in: path, required: true, schema: {type: string}}]
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Route}}}
    put:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TunnelRequest'}}}
      responses: {'200': {description: Updated route}, '400': {description: Invalid route fields}, '403': {description: Caller cannot manage the current or target Agent}, '409': {description: Duplicate domain and path}}
    patch:
      security: [{bearerAuth: []}]
      description: Updates only supplied route fields. Agent, protocol, domain, path, target, public port, status, and config are supported.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TunnelUpdateRequest'}}}
      responses: {'200': {description: Updated route}, '400': {description: Invalid route fields}, '403': {description: Caller cannot manage the current or target Agent}, '409': {description: Duplicate domain and path}}
    delete: {security: [{bearerAuth: []}], responses: {'200': {description: Deleted}}}
  /api/v1/tunnels:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Tunnels}}}
    post: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TunnelRequest'}}}}, responses: {'201': {description: Created}}}
  /api/v1/tunnels/{tunnelId}:
    parameters: [{name: tunnelId, in: path, required: true, schema: {type: string}}]
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Tunnel}}}
    put: {security: [{bearerAuth: []}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TunnelRequest'}}}}, responses: {'200': {description: Updated}}}
    delete: {security: [{bearerAuth: []}], responses: {'200': {description: Deleted}}}
  /api/v1/tokens:
    get:
      summary: List scoped service Token metadata
      description: Admins may filter all Tokens by owner and type. Non-admin callers can list only Tokens they own. Stored hashes and issued secrets are never returned. Status is derived from lifecycle timestamps and current owner/resource availability.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TokenTypeFilter'}
        - {$ref: '#/components/parameters/TokenOwnerFilter'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Cursor page of redacted Token metadata, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPageEnvelope'}}}}
        '400': {description: Invalid Token type or pagination input}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: A non-admin requested another owner's Tokens}
    post:
      summary: Create a scoped service Token
      description: |
        The plaintext `secret` is returned exactly once on the first successful request. When `TUNNELMESH_TOKEN_ENCRYPTION_KEY` is configured it is encrypted at rest and can be recovered only through the administrator reveal endpoint; otherwise existing hash-only behavior applies. Reusing the same `Idempotency-Key` with the same request returns the same Token ID and metadata with `secret` omitted and `replayed=true`. Reusing a key for another request, or observing a request still in progress, returns 409.

        Admins may create `agent`, `client`, and `server_node` Tokens. Non-admin owners may create an `agent` Token only for an enabled Agent they own, or a `client` Token whose scoped Agents are all enabled and owned by them. Non-admin callers cannot create `server_node` Tokens.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenCreateRequest'}
      responses:
        '201': {description: Token created, or safely replayed without its secret, content: {application/json: {schema: {$ref: '#/components/schemas/TokenMutationEnvelope'}}}}
        '400': {description: Invalid type, binding, expiry, scope, JSON, or Idempotency-Key}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Owner/resource authorization denied}
        '409': {description: Idempotency-Key conflict or request in progress}
  /api/v1/server-nodes:
    get:
      summary: List Server node inventory and runtime status
      description: Administrator-only inventory. Status is derived from logical lifecycle, heartbeat expiry, and active Agent connection leases. Token secrets and private keys are never returned.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Cursor page, content: {application/json: {schema: {$ref: '#/components/schemas/ServerNodePageEnvelope'}}}}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Administrator required}
  /api/v1/server-nodes/{nodeId}:
    parameters:
      - {name: nodeId, in: path, required: true, schema: {type: string}}
    get:
      summary: Read one Server node
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Server node, content: {application/json: {schema: {$ref: '#/components/schemas/ServerNodeEnvelope'}}}}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Administrator required}
        '404': {description: Not found}
    patch:
      summary: Update a Server node display name or enabled state
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServerNodeUpdateRequest'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/ServerNodeEnvelope'}}}}
        '400': {description: Invalid name or empty update}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Administrator required}
        '404': {description: Not found}
    delete:
      summary: Logically delete a Server node
      description: Sets deleted_at and disables the node while retaining its inventory record for restoration.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Logically deleted, content: {application/json: {schema: {$ref: '#/components/schemas/ServerNodeEnvelope'}}}}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Administrator required}
        '404': {description: Not found}
  /api/v1/server-nodes/{nodeId}/restore:
    parameters:
      - {name: nodeId, in: path, required: true, schema: {type: string}}
    post:
      summary: Restore a logically deleted Server node
      description: Clears deleted_at and enables the node. Relay mTLS and epoch checks still apply.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Restored, content: {application/json: {schema: {$ref: '#/components/schemas/ServerNodeEnvelope'}}}}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Administrator required}
        '404': {description: Not found}
  /api/v1/tokens/{tokenId}:
    parameters:
      - {name: tokenId, in: path, required: true, schema: {type: string}}
    get:
      summary: Read redacted scoped service Token metadata
      description: Returns dynamically derived status without the Token hash or plaintext secret.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Redacted Token metadata, content: {application/json: {schema: {$ref: '#/components/schemas/TokenMetadataEnvelope'}}}}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Token is not owned by the non-admin caller}
        '404': {description: Token not found}
    patch:
      summary: Update an active service Token
      description: 'Updates `expiresAt` and/or authorization scope fields. Send `expiresAt: null` to make the Token non-expiring. Scope fields that are omitted remain unchanged; empty arrays remove that restriction. `agentIds` is valid only for client Tokens, and `serverNodeIds` is valid only for server_node Tokens. Token type, owner, and Agent/Node binding cannot be changed. Revoked and already expired Tokens must be rotated instead.'
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenUpdateRequest'}
      responses:
        '200': {description: Updated redacted Token metadata, content: {application/json: {schema: {$ref: '#/components/schemas/TokenMetadataEnvelope'}}}}
        '400': {description: Missing update field, invalid or non-future expiresAt, or invalid scope}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Token is not owned by the non-admin caller}
        '404': {description: Token not found}
        '409': {description: Token is revoked or already expired}
  /api/v1/tokens/{tokenId}/rotate:
    parameters:
      - {name: tokenId, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      summary: Atomically rotate and revoke a scoped service Token
      description: Creates a replacement and revokes the old Token in one transaction. The replacement secret is returned once; an idempotent replay returns the same replacement metadata with no secret and `replayed=true`.
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Replacement Token created, or safely replayed, content: {application/json: {schema: {$ref: '#/components/schemas/TokenMutationEnvelope'}}}}
        '400': {description: Invalid Idempotency-Key}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Token is not owned by the non-admin caller}
        '404': {description: Token not found}
        '409': {description: Token cannot be rotated or idempotency request conflicts/is in progress}
  /api/v1/tokens/{tokenId}/revoke:
    parameters:
      - {name: tokenId, in: path, required: true, schema: {type: string}}
    post:
      summary: Revoke a scoped service Token
      description: Revocation is idempotent and returns redacted metadata with dynamically derived `revoked` status.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Token revoked, content: {application/json: {schema: {$ref: '#/components/schemas/TokenMetadataEnvelope'}}}}
        '401': {description: Missing or invalid management bearer Token}
        '403': {description: Token is not owned by the non-admin caller}
        '404': {description: Token not found}
        '409': {description: Concurrent lifecycle conflict}
  /api/v1/tokens/{tokenId}/reveal:
    parameters: [{name: tokenId, in: path, required: true, schema: {type: string}}]
    post:
      summary: Reveal an encrypted service-token secret
      description: Administrator-only, audited, no-store response. Requires X-Token-Reveal-Confirm and Idempotency-Key. Hash-only legacy tokens must be rotated first.
      security: [{bearerAuth: []}]
      parameters:
        - {name: X-Token-Reveal-Confirm, in: header, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses: {'200': {description: One-time secret, content: {application/json: {schema: {$ref: '#/components/schemas/TokenRevealEnvelope'}}}}, '403': {description: Admin permission required}, '409': {description: Secret is not recoverable}}
  /api/v1/traces/{traceId}:
    parameters: [{name: traceId, in: path, required: true, schema: {type: string}}]
    get:
      summary: Read a previously completed logical traceroute
      security: [{bearerAuth: []}]
      responses: {'200': {description: Trace result, content: {application/json: {schema: {$ref: '#/components/schemas/TraceEnvelope'}}}}, '404': {description: Trace not found}}
  /api/v1/audit-logs:
    get:
      security: [{bearerAuth: []}]
      summary: List audit logs newest first
      description: Returns a filtered cursor page ordered by createdAt descending and ID descending as a deterministic tie-breaker. Text filters are exact matches; createdFrom and createdTo are inclusive. Cursors are opaque; cursors issued by older versions are accepted.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: actorUserId, in: query, schema: {type: string, maxLength: 255}, description: Exact actor user ID}
        - {name: action, in: query, schema: {type: string, maxLength: 255}, description: Exact audit action}
        - {name: resourceType, in: query, schema: {type: string, maxLength: 255}, description: Exact resource type}
        - {name: resourceId, in: query, schema: {type: string, maxLength: 255}, description: Exact resource ID}
        - {name: createdFrom, in: query, schema: {type: string, format: date-time}, description: Inclusive start time}
        - {name: createdTo, in: query, schema: {type: string, format: date-time}, description: Inclusive end time}
      responses:
        '200': {description: Cursor page of audit records, content: {application/json: {schema: {$ref: '#/components/schemas/AuditLogPageEnvelope'}}}}
        '400': {description: Invalid time filter}
        '403': {description: Admin permission required}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
    IncludeStale: {name: includeStale, in: query, description: Include an expired or explicitly stale snapshot, schema: {type: boolean, default: false}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
    TokenTypeFilter: {name: type, in: query, schema: {type: string, enum: [agent, client, server_node]}}
    TokenOwnerFilter: {name: owner, in: query, description: Owner user ID; admin-only when it differs from the current user, schema: {type: string}}
  schemas:
    Envelope: {type: object, required: [code, msg, data], properties: {code: {type: integer}, msg: {type: string}, data: {type: object}}}
    LoginRequest: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string, format: password}}}
    PasswordChangeRequest: {type: object, additionalProperties: false, required: [currentPassword, newPassword], properties: {currentPassword: {type: string, format: password}, newPassword: {type: string, format: password, minLength: 12, maxLength: 128}}}
    UserCreateRequest: {type: object, additionalProperties: false, required: [username], properties: {username: {type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}}}
    UserStatusRequest: {type: object, additionalProperties: false, required: [disabled], properties: {disabled: {type: boolean}}}
    AgentRequest: {type: object, required: [name], properties: {name: {type: string}, capabilities: {type: array, items: {type: string}}, enabled: {type: boolean}}}
    AgentMetadataEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AgentMetadata'}
    AgentMetadata:
      type: object
      required: [agentId, instanceId, nodeId, epoch, revision, stale, reportedAt, updatedAt, items, instances]
      properties:
        agentId: {type: string}
        instanceId: {type: string, description: Instance ID of the freshest healthy metadata row}
        nodeId: {type: string}
        epoch: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        stale: {type: boolean}
        reportedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/AgentMetadataItem'}}
        instances:
          type: array
          description: Metadata for every reporting Agent instance
          items: {$ref: '#/components/schemas/AgentMetadataInstance'}
        connections:
          type: array
          description: Live local connections; empty when the API process cannot see local state
          items: {$ref: '#/components/schemas/AgentConnection'}
    AgentMetadataInstance:
      type: object
      required: [instanceId, nodeId, epoch, revision, stale, reportedAt, updatedAt, items]
      properties:
        instanceId: {type: string}
        nodeId: {type: string}
        epoch: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        stale: {type: boolean}
        reportedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/AgentMetadataItem'}}
        connectionCount: {type: integer, minimum: 0}
    AgentConnection:
      type: object
      required: [agentId, instanceId, nodeId, connectionId, epoch, connectionEpoch, healthy, activeStreams, lastHeartbeatAt]
      properties:
        agentId: {type: string}
        instanceId: {type: string}
        nodeId: {type: string}
        connectionId: {type: string}
        epoch: {type: integer, format: int64}
        connectionEpoch: {type: integer, format: int64}
        serverNodeId: {type: string}
        healthy: {type: boolean}
        activeStreams: {type: integer, minimum: 0}
        lastHeartbeatAt: {type: string, format: date-time}
    AgentConnectionClusterEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [connections]
              properties:
                connections: {type: array, items: {$ref: '#/components/schemas/ClusterAgentConnection'}}
    ClusterAgentConnection:
      type: object
      additionalProperties: false
      required: [agentId, instanceId, connectionId, connectionEpoch, serverNodeId, serverNodeEpoch, serverNodeAddress, healthy, activeStreams, healthScore, leaseExpiresAt, local]
      properties:
        agentId: {type: string}
        instanceId: {type: string}
        connectionId: {type: string}
        connectionEpoch: {type: integer, format: int64, description: Registry lease epoch used for cross-node close fencing}
        serverNodeId: {type: string}
        serverNodeEpoch: {type: integer, format: int64}
        serverNodeAddress: {type: string, description: Authenticated relay endpoint of the owning Server node}
        healthy: {type: boolean}
        activeStreams: {type: integer, minimum: 0}
        healthScore: {type: integer, format: int64, minimum: 0}
        lastHeartbeatAt: {type: string, format: date-time}
        leaseExpiresAt: {type: string, format: date-time}
        local: {type: boolean, description: True when the responding Server owns the physical WebSocket}
    AgentConnectionCloseEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AgentConnectionCloseResult'}
    AgentConnectionCloseResult:
      type: object
      additionalProperties: false
      required: [agentId, connectionId, connectionEpoch, closed]
      properties:
        agentId: {type: string}
        connectionId: {type: string}
        connectionEpoch: {type: integer, format: int64}
        closed: {type: boolean}
    AgentMetadataItem:
      type: object
      required: [name, source, redacted]
      properties:
        name: {type: string}
        source: {type: string, enum: [file, env]}
        value: {type: string, description: Omitted for redacted sensitive fields}
        redacted: {type: boolean}
    PolicyRequest: {type: object, required: [targetHost, targetPort], properties: {targetHost: {type: string}, targetPort: {type: integer, minimum: 1, maximum: 65535}, protocol: {type: string}, allowedCIDRs: {type: array, items: {type: string}}, allowedPorts: {type: array, items: {type: integer}}}}
    TunnelRequest:
      type: object
      required: [agentId, targetHost, targetPort]
      properties:
        agentId: {type: string}
        protocol: {type: string, enum: [http, websocket], description: Public application protocol}
        domain: {type: string, description: Exact domain or single-level tm-* wildcard}
        pathPrefix: {type: string, default: /}
        targetHost: {type: string, description: IP or hostname that the Agent dials}
        targetPort: {type: integer, minimum: 1, maximum: 65535}
        publicPort: {type: integer}
        status: {type: string}
        hostHeader: {type: string, description: Host sent to the upstream service; defaults to targetHost}
        targetScheme: {type: string, enum: [http, https], default: http, description: Upstream transport scheme used by the Agent}
        tlsServerName: {type: string, description: TLS SNI and certificate name; requires targetScheme https and defaults to targetHost}
        config: {type: object, description: Backward-compatible route configuration; new route fields are also persisted here}
    TunnelUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        agentId: {type: string, description: Omitted preserves the current Agent}
        protocol: {type: string, enum: [http, websocket], description: Omitted preserves the current protocol}
        domain: {type: string, description: Exact domain or single-level tm-* wildcard}
        pathPrefix: {type: string, default: /}
        targetHost: {type: string}
        targetPort: {type: integer, minimum: 1, maximum: 65535}
        hostHeader: {type: string, description: Omitted preserves the current Host header; empty uses targetHost}
        targetScheme: {type: string, enum: [http, https], description: Omitted preserves the current upstream scheme; empty defaults to http}
        tlsServerName: {type: string, description: Omitted preserves the current TLS name; empty uses targetHost}
        publicPort: {type: integer, minimum: 0, maximum: 65535}
        status: {type: string, enum: [active, disabled]}
        config: {type: object}
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, action, resourceType, createdAt]
      properties:
        id: {type: string}
        actorUserId: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        details: {type: object, additionalProperties: true, description: Action-specific non-secret facts}
        createdAt: {type: string, format: date-time}
    AuditLogPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
                nextCursor: {type: string}
                hasMore: {type: boolean}
    ServerNode:
      type: object
      additionalProperties: false
      required: [id, name, address, epoch, enabled, status, activeConnections, activeStreams, healthScore, createdAt, updatedAt]
      properties:
        id: {type: string, maxLength: 255}
        name: {type: string, minLength: 1, maxLength: 255}
        address: {type: string}
        epoch: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        deletedAt: {type: string, format: date-time, nullable: true}
        lastSeenAt: {type: string, format: date-time, nullable: true}
        expiresAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [online, offline, disabled, deleted]}
        activeConnections: {type: integer, format: int64, minimum: 0}
        activeStreams: {type: integer, format: int64, minimum: 0}
        healthScore: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ServerNodeUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        enabled: {type: boolean}
    ServerNodeEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties: {data: {$ref: '#/components/schemas/ServerNode'}}
    ServerNodePage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ServerNode'}}
        nextCursor: {type: string}
        hasMore: {type: boolean}
    ServerNodePageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties: {data: {$ref: '#/components/schemas/ServerNodePage'}}
    TokenScope:
      type: object
      additionalProperties: false
      properties:
        agentIds: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, maxLength: 255}, description: Explicit client-token Agent allowlist; an empty or omitted array allows every Agent authorized to the token owner}
        serverNodeIds: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, maxLength: 255}, description: Explicit server_node allowlist; an empty or omitted array allows every enabled, non-deleted Server node}
        protocols: {type: array, maxItems: 4, uniqueItems: true, items: {type: string, enum: [tcp, udp, http, ws, websocket]}}
        targetCIDRs: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, description: IPv4 or IPv6 CIDR}}
        targetPorts: {type: array, maxItems: 1024, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
    TokenScopeUpdate:
      type: object
      additionalProperties: false
      properties:
        agentIds: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, maxLength: 255}, description: Client-token Agent allowlist; empty allows every Agent owned by the Token owner, omitted preserves the current value}
        serverNodeIds: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, maxLength: 255}, description: server_node allowlist; empty creates a fleet Token, omitted preserves the current value}
        protocols: {type: array, maxItems: 4, uniqueItems: true, items: {type: string, enum: [tcp, udp, http, ws, websocket]}, description: Empty array allows every protocol; omitted preserves the current value}
        targetCIDRs: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, description: IPv4 or IPv6 CIDR}, description: Empty array allows every target address; omitted preserves the current value}
        targetPorts: {type: array, maxItems: 1024, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}, description: Empty array allows every port; omitted preserves the current value}
    TokenCreateRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [agent, client, server_node]}
        ownerUserId: {type: string, description: Defaults to the authenticated management user; only admins may name another owner}
        agentId: {type: string, description: Required only for agent Tokens}
        nodeId: {type: string, deprecated: true, description: Legacy single-node binding; new server_node Tokens use scope.serverNodeIds}
        scope:
          allOf: [{$ref: '#/components/schemas/TokenScope'}]
          description: Optional narrowing scope; omission is equivalent to an empty scope
        expiresAt: {type: string, format: date-time, description: Optional future expiration time}
    TokenUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Future expiration time, or null for a non-expiring Token; omitted preserves the current value
        scope:
          allOf: [{$ref: '#/components/schemas/TokenScopeUpdate'}]
          description: Optional authorization-scope update
    TokenMetadata:
      type: object
      additionalProperties: false
      required: [id, type, ownerUserId, prefix, scope, status, createdAt, updatedAt, replayed]
      properties:
        id: {type: string}
        type: {type: string, enum: [agent, client, server_node]}
        ownerUserId: {type: string}
        agentId: {type: string}
        nodeId: {type: string}
        prefix: {type: string, description: Short non-secret display prefix}
        scope: {$ref: '#/components/schemas/TokenScope'}
        status: {type: string, enum: [active, revoked, expired, unavailable], description: Derived from timestamps and current owner/bound-resource state}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        replayed: {type: boolean, description: True only for an idempotent create/rotate replay}
    TokenMutation:
      allOf:
        - {$ref: '#/components/schemas/TokenMetadata'}
        - type: object
          properties:
            secret: {type: string, readOnly: true, description: One-time plaintext credential; present only on the first successful create or rotate response and never on replay}
    TokenMetadataEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/TokenMetadata'}
    TokenMutationEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/TokenMutation'}
    TokenPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TokenMetadata'}}
        nextCursor: {type: string}
        hasMore: {type: boolean}
    TokenPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/TokenPage'}
    TokenReveal:
      type: object
      required: [tokenId, type, secret, revealedAt, oneTime]
      properties:
        tokenId: {type: string}
        type: {type: string}
        secret: {type: string, readOnly: true}
        expiresAt: {type: string, format: date-time}
        revealedAt: {type: string, format: date-time}
        oneTime: {type: boolean}
    TokenRevealEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties: {data: {$ref: '#/components/schemas/TokenReveal'}}
    TraceRequest:
      type: object
      properties:
        timeoutMs: {type: integer, minimum: 100, maximum: 30000}
        maxHops: {type: integer, minimum: 1, maximum: 16}
        verbose: {type: boolean}
        includeSensitive: {type: boolean}
        includeSecrets: {type: boolean}
    TraceEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties: {data: {type: object}}
    DiagnoseRequest:
      type: object
      required: [kind, host, port]
      properties:
        kind: {type: string, enum: [tcp, http, udp]}
        host: {type: string, maxLength: 255}
        port: {type: integer, minimum: 1, maximum: 65535}
        timeoutMs: {type: integer, minimum: 10, maximum: 30000}

      type: object
      required: [targetHost, targetPort]
      properties:
        targetHost: {type: string, description: Exact IP or hostname; use * to match any host}
        targetPort: {type: integer, minimum: 0, maximum: 65535, description: Exact target port; use 0 to match any port}
        protocol: {type: string}
        allowedCIDRs: {type: array, items: {type: string}, description: Additional IP allowlist; an empty array means unrestricted}
        allowedPorts: {type: array, items: {type: integer}, description: Additional port allowlist; an empty array means unrestricted}
    PolicyEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Policy'}
    PolicyPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/PolicyPage'}
    Policy:
      type: object
      required: [id, agentId, protocol, targetHost, targetPort, allowedCIDRs, allowedPorts, createdAt, updatedAt]
      properties:
        id: {type: string}
        agentId: {type: string}
        protocol: {type: string}
        targetHost: {type: string}
        targetPort: {type: integer, minimum: 0, maximum: 65535}
        allowedCIDRs: {type: array, items: {type: string}}
        allowedPorts: {type: array, items: {type: integer}}
        deletedAt: {type: string, format: date-time, nullable: true, description: Non-null means the policy is logically deleted and does not authorize traffic}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PolicyPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Policy'}}
        nextCursor: {type: string}
        hasMore: {type: boolean}
    TunnelRequest:
      type: object
      required: [agentId]
      properties:
        agentId: {type: string}
        protocol: {type: string, enum: [http, websocket, http-proxy], description: 'Public application protocol. http-proxy creates a whole-host managed proxy entry instead of a reverse-proxy route.'}
        domain: {type: string, description: 'Exact domain or single-level tm-* wildcard. An http-proxy route must use tp-<name>.<suffix> with a lowercase name of at most 32 characters.'}
        pathPrefix: {type: string, default: /, description: Forced to / for http-proxy routes, where it carries no routing meaning}
        targetHost: {type: string, description: 'IP or hostname that the Agent dials. Required unless protocol is http-proxy, which must omit it: the server stores the wildcard sentinel * because the real target comes from each proxied request.'}
        targetPort: {type: integer, minimum: 1, maximum: 65535, description: Required unless protocol is http-proxy, which must omit it; the server stores 0.}
        publicPort: {type: integer}
        status: {type: string}
        hostHeader: {type: string, description: Host sent to the upstream service; defaults to targetHost}
        targetScheme: {type: string, enum: [http, https], default: http, description: Upstream transport scheme used by the Agent}
        tlsServerName: {type: string, description: TLS SNI and certificate name; requires targetScheme https and defaults to targetHost}
        config: {type: object, description: 'Backward-compatible route configuration; new route fields are also persisted here. Must be omitted for http-proxy routes, which use the dedicated policy fields below.'}
        authMode: {type: string, enum: [none, basic], default: none, description: 'http-proxy only: authentication the proxy entry enforces on every proxied request'}
        credentialId: {type: string, description: 'http-proxy only: required when authMode is basic and must reference an enabled proxy_basic credential the caller may read'}
        sourceCIDRs: {type: array, items: {type: string}, description: 'http-proxy only: client IP allowlist evaluated on the real peer address. Bare IPs are normalized to /32 or /128, duplicates are dropped and the supplied order is kept. An empty list denies every client.'}
        targetCIDRs: {type: array, items: {type: string}, description: 'http-proxy only: target network allowlist. Empty allows any address the dangerous-address filter permits.'}
        targetPorts: {type: array, items: {type: integer, minimum: 1, maximum: 65535}, description: 'http-proxy only: target port allowlist, deduped and sorted. Empty allows any port. It applies to hostname targets as well as IP literals.'}
        allowPrivateTargets: {type: boolean, default: true, description: 'http-proxy only: whether loopback, private, link-local and unique-local targets may be dialled. Cloud metadata addresses are refused either way.'}
        maxConcurrentTunnels: {type: integer, minimum: 0, description: 'http-proxy only: per-route concurrent tunnel cap; 0 keeps the server-wide default'}
        description: {type: string, maxLength: 256, description: 'http-proxy only: operator note rendered by the admin UI'}
    TunnelUpdateRequest:
      type: object
      additionalProperties: false
      description: Omitted fields keep their stored value. `protocol` cannot be switched to or from `http-proxy`; create a new route instead.
      properties:
        agentId: {type: string, description: Omitted preserves the current Agent}
        protocol: {type: string, enum: [http, websocket, http-proxy], description: Omitted preserves the current protocol; switching to or from http-proxy is refused with 400}
        domain: {type: string, description: Exact domain or single-level tm-* wildcard}
        pathPrefix: {type: string, default: /}
        targetHost: {type: string, description: 'Fixed to the * sentinel on an http-proxy route; sending any other value is refused with 400'}
        targetPort: {type: integer, minimum: 0, maximum: 65535, description: 'Fixed to 0 on an http-proxy route; sending any other value is refused with 400'}
        hostHeader: {type: string, description: Omitted preserves the current Host header; empty uses targetHost}
        targetScheme: {type: string, enum: [http, https], description: Omitted preserves the current upstream scheme; empty defaults to http}
        tlsServerName: {type: string, description: Omitted preserves the current TLS name; empty uses targetHost}
        publicPort: {type: integer, minimum: 0, maximum: 65535}
        status: {type: string, enum: [active, disabled]}
        config: {type: object, description: Must be omitted on an http-proxy route together with hostHeader, targetScheme and tlsServerName}
        authMode: {type: string, enum: [none, basic], description: 'http-proxy only; switching to basic re-validates the stored credentialId when none is supplied'}
        credentialId: {type: string, description: 'http-proxy only; must reference an enabled proxy_basic credential'}
        sourceCIDRs: {type: array, items: {type: string}, description: 'http-proxy only; an explicit empty list denies every client, which is a real change and not an omission'}
        targetCIDRs: {type: array, items: {type: string}, description: 'http-proxy only; replaces the stored allowlist'}
        targetPorts: {type: array, items: {type: integer, minimum: 1, maximum: 65535}, description: 'http-proxy only; replaces the stored allowlist'}
        allowPrivateTargets: {type: boolean, description: 'http-proxy only'}
        maxConcurrentTunnels: {type: integer, minimum: 0, description: 'http-proxy only; 0 restores the server-wide default'}
        description: {type: string, maxLength: 256, description: 'http-proxy only'}
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, action, resourceType, createdAt]
      properties:
        id: {type: string}
        actorUserId: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        details: {type: object, additionalProperties: true, description: Action-specific non-secret facts}
        createdAt: {type: string, format: date-time}
    AuditLogPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
                nextCursor: {type: string}
                hasMore: {type: boolean}
    ServerNode:
      type: object
      additionalProperties: false
      required: [id, name, address, epoch, enabled, status, activeConnections, activeStreams, healthScore, createdAt, updatedAt]
      properties:
        id: {type: string, maxLength: 255}
        name: {type: string, minLength: 1, maxLength: 255}

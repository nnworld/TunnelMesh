services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: server
    image: tunnelmesh:server-local
    command: ["run"]
    environment:
      TUNNELMESH_MODE: local
      TUNNELMESH_STORAGE_DRIVER: sqlite
      TUNNELMESH_STORAGE_SQLITE_PATH: /var/lib/tunnelmesh/tunnelmesh.db
      TUNNELMESH_STORAGE_AUTO_INIT: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tunnelmesh-server-data:/var/lib/tunnelmesh
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: agent
    image: tunnelmesh:agent-local
    command: ["run"]
    environment:
      TUNNELMESH_MODE: local
      TUNNELMESH_AGENT_SERVER_URL: ${TUNNELMESH_AGENT_SERVER_URL:-wss://server/agent}
      TUNNELMESH_AGENT_ID: ${TUNNELMESH_AGENT_ID:-}
    depends_on:
      - server
    restart: unless-stopped

  client:
    profiles: ["client"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: client
    image: tunnelmesh:client-local
    command: ["login"]
    environment:
      TUNNELMESH_MODE: local
      TUNNELMESH_CLIENT_SERVER_URL: ${TUNNELMESH_CLIENT_SERVER_URL:-https://localhost}
    depends_on:
      - server
    stdin_open: true
    tty: true

volumes:
  tunnelmesh-server-data:
